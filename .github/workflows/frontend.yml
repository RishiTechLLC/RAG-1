# Angular chat UI -> Azure Static Web Apps.
name: Frontend (Angular)

on:
  push:
    branches: [main]
    paths:
      - src/Frontend/**
      - .github/workflows/frontend.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: src/Frontend/chat-ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Frontend/chat-ui/package-lock.json

      - run: npm ci
      - run: npm run test:ci

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web App and Agents API
        id: azure
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          swa=$(az staticwebapp list -g $rg --query "[0].name" -o tsv)
          token=$(az staticwebapp secrets list -n "$swa" -g $rg --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          api=$(az resource list -g $rg --tag service=agents-api --query "[?type=='Microsoft.Web/sites'].name | [0]" -o tsv)
          host=$(az webapp show -g $rg -n "$api" --query defaultHostName -o tsv)
          echo "apiUrl=https://$host" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        run: |
          echo '{ "apiBaseUrl": "${{ steps.azure.outputs.apiUrl }}" }' > public/config.json

      - run: npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.azure.outputs.token }}
          action: upload
          app_location: src/Frontend/chat-ui/dist/chat-ui/browser
          skip_app_build: true
          skip_api_build: true
