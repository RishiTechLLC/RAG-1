# Provisions / updates all Azure resources from infra/main.bicep.
name: Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_OPENAI_LOCATION: ${{ vars.AZURE_OPENAI_LOCATION || vars.AZURE_LOCATION }}
      AZURE_DEPLOYER_PRINCIPAL_ID: ${{ vars.AZURE_DEPLOYER_PRINCIPAL_ID }}
      AZURE_DEVELOPER_PRINCIPAL_ID: ${{ vars.AZURE_DEVELOPER_PRINCIPAL_ID }}
      # Student database: OnPrem (default, via Hybrid Connection) or Azure
      AZURE_SQL_MODE: ${{ vars.AZURE_SQL_MODE || 'OnPrem' }}
      AZURE_ONPREM_SQL_HOST: ${{ vars.AZURE_ONPREM_SQL_HOST }}
      AZURE_ONPREM_SQL_PORT: ${{ vars.AZURE_ONPREM_SQL_PORT || '1433' }}
      ONPREM_SQL_CONNECTION_STRING: ${{ secrets.ONPREM_SQL_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate SQL settings
        run: |
          if [ "$AZURE_SQL_MODE" = "OnPrem" ]; then
            missing=""
            [ -z "$AZURE_ONPREM_SQL_HOST" ] && missing="$missing variable AZURE_ONPREM_SQL_HOST,"
            [ -z "$ONPREM_SQL_CONNECTION_STRING" ] && missing="$missing secret ONPREM_SQL_CONNECTION_STRING,"
            if [ -n "$missing" ]; then
              echo "::error::AZURE_SQL_MODE=OnPrem needs:${missing%,}. See docs/azure-deployment.md (On-prem SQL Server)."
              exit 1
            fi
            case "$ONPREM_SQL_CONNECTION_STRING" in
              *"$AZURE_ONPREM_SQL_HOST"*) ;;
              *) echo "::warning::The connection string's Server= does not contain '$AZURE_ONPREM_SQL_HOST'. App Service only tunnels that exact host:port through the Hybrid Connection." ;;
            esac
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create -n "${{ vars.AZURE_RESOURCE_GROUP }}" -l "${{ vars.AZURE_LOCATION }}" -o none

      - name: What-if
        run: |
          az deployment group what-if -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep --parameters infra/main.bicepparam

      - name: Deploy
        id: deploy
        run: |
          az deployment group create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n rag-platform \
            --template-file infra/main.bicep --parameters infra/main.bicepparam \
            --query properties.outputs -o json > outputs.json
          jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' outputs.json > rows.md
          { echo "### Deployment outputs"; echo "| Output | Value |"; echo "|---|---|"; cat rows.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AZURE_SQL_MODE" = "OnPrem" ]; then
            {
              echo ""
              echo "### Next: connect your on-prem SQL Server"
              echo "Install the **Hybrid Connection Manager** on a Windows machine that can reach \`$AZURE_ONPREM_SQL_HOST:$AZURE_ONPREM_SQL_PORT\`,"
              echo "sign in and add the hybrid connection \`$(jq -r .hybridConnectionName.value outputs.json)\`. See docs/azure-deployment.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
